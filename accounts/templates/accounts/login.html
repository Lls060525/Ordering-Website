{% extends 'base.html' %}
{% block content %}
<style>
    /* Full-screen centering */
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }

    .glass-card {
        width: 100%;
        max-width: 420px; /* Controlled width for symmetry */
        padding: 3rem; /* Equal padding on all sides */
        text-align: center; /* Centers header and footer text */
    }

    .modern-form {
        display: flex;
        flex-direction: column;
        align-items: stretch; /* Forces children to be equal width */
        gap: 1.5rem; /* Even spacing between fields */
    }

    .field-group {
        text-align: left; /* Keeps labels readable but aligned with input edge */
    }

    .modern-form label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #6b7280;
        margin-bottom: 0.5rem;
        margin-left: 5px; /* Slight offset for better optical alignment */
    }

    .modern-form input {
        width: 100%; /* Ensures inputs are identical in width */
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.6) !important;
        border: 2px solid transparent !important;
        border-radius: 15px;
        transition: all 0.3s ease;
    }

    .modern-form input:focus {
        border-color: #a855f7 !important;
        background: white !important;
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
    }

    /* Button Symmetry */
    .btn-glow {
        width: 100%; /* Matches input width exactly */
        padding: 16px;
        border-radius: 15px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        color: white;
        font-weight: 700;
        border: none;
        margin-top: 1rem;
        box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
    }

    .btn-glow:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px -10px rgba(99, 102, 241, 0.6);
    }
</style>

<div class="login-wrapper">
    <div class="glass-card animate-fade-in">
        <div class="mb-5">
            <h2 class="fw-bold display-6" style="color: #6366f1;">Welcome Back</h2>
            <p class="text-muted small">Enter your details to access your account</p>
        </div>

        <form method="post" class="modern-form">
            {% csrf_token %}

            <div class="field-group">
                <label>Email Address</label>
                {{ form.username }}
            </div>

            <div class="field-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-glow">
                Sign In to MarketHub
            </button>
        </form>

        <div class="mt-5 pt-4 border-top">
            <p class="text-muted small mb-1">New to the platform?</p>
            <a href="{% url 'customer_signup' %}" class="text-decoration-none fw-bold" style="color: #a855f7;">
                Create a Free Account
            </a>
        </div>
    </div>
</div>
{% endblock %}
