{% extends 'base.html' %}
{% block content %}
<style>
    .form-wrapper {
        display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 40px 0;
    }
    .modern-form { display: flex; flex-direction: column; gap: 1.5rem; text-align: left; }
    .modern-form label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #6b7280; margin-bottom: 0.5rem; margin-left: 5px; }
    .modern-form input, .modern-form textarea { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.6) !important; border: 2px solid transparent !important; border-radius: 15px; transition: all 0.3s ease; }
    .modern-form textarea { height: 120px; resize: none; }
    .modern-form input:focus, .modern-form textarea:focus { border-color: #10b981 !important; background: white !important; box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); }

    /* Style for the file input */
    .modern-form input[type="file"] { padding: 10px; background: rgba(16, 185, 129, 0.05) !important; border: 2px dashed rgba(16, 185, 129, 0.3) !important; }

    .btn-vendor { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; margin-top: 1rem; box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.5); }
    .helptext { display: none; }
</style>

<div class="form-wrapper">
    <div class="glass-card p-5" style="width: 100%; max-width: 600px;">
        <div class="text-center mb-5">
            <span class="badge rounded-pill mb-2" style="background: rgba(16, 185, 129, 0.1); color: #059669; padding: 8px 16px;">Inventory Management</span>
            <h2 class="fw-bold display-6" style="color: #065f46;">{{ title }}</h2>
            <p class="text-muted small">Fill in the details to publish your product.</p>
        </div>

        <form method="post" enctype="multipart/form-data" class="modern-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="field-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <small class="text-danger">{{ field.errors|striptags }}</small>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-vendor mt-3 w-100">{{ title }}</button>
            <a href="{% url 'vendor_product_list' %}" class="btn btn-link w-100 mt-2 text-muted text-decoration-none small">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
