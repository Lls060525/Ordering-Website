{% extends 'base.html' %}
{% block content %}
<h1 class="fw-bold mb-5">Explore <span class="text-primary">MarketHub</span></h1>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for product in products %}
    <div class="col">
        <div class="card glass-card h-100 p-0 overflow-hidden border-0">
            <div style="height: 200px; width: 100%; overflow: hidden;">
                <img src="{{ product.image_url }}" alt="{{ product.name }}" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <div class="card-body d-flex flex-column p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h4 class="card-title fw-bold mb-0">{{ product.name }}</h4>
                    <span class="badge bg-light text-dark border">Stock: {{ product.stock }}</span>
                </div>
                <p class="text-muted small mb-3">Sold by: {{ product.vendor.store_name }}</p>
                <p class="card-text text-secondary mb-4 flex-grow-1">{{ product.description|truncatewords:15 }}</p>

                <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                    <span class="h4 mb-0 fw-bold">${{ product.price }}</span>
                    <a href="{% url 'add_to_cart' product.id %}" class="btn-neon-purple py-2 px-3">Add to Cart</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
